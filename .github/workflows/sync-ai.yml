name: Sync AI rules

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: write

concurrency:
  group: sync-ai
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and synchronize upstream rules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_ai.py
      - name: Test synchronization
        run: python3 -m unittest discover -s tests -v
      - name: Commit changes
        run: |
          git add rules/OpenAI.list rules/Anthropic.list rules/Global.list support/Anthropic-Domains.list reports/ai-sync.json reports/release-report.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Sync VPSDance AI rule lists'
            git push
          fi
